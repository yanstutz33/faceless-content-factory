name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install FFmpeg and Python dependencies
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run operational diagnostics
        run: python app.py doctor
      - name: Validate frontend JavaScript
        shell: pwsh
        run: |
          Get-ChildItem web -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install browser test dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Run browser and accessibility tests
        run: pnpm run test:e2e

