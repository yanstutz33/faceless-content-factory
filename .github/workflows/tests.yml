name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install FFmpeg and Python dependencies
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run operational diagnostics
        run: python app.py doctor
      - name: Validate frontend JavaScript
        shell: pwsh
        run: |
          Get-ChildItem web -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install browser test dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Run browser and accessibility tests
        run: pnpm run test:e2e

  cloud-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build cloud image
        run: docker build --tag ffactory-cloud:test .
      - name: Start cloud image
        run: |
          docker run --detach --name ffactory-cloud \
            --publish 8787:8787 \
            --env FACTORY_REMOTE_ACCESS=true \
            --env FACTORY_REMOTE_USERNAME=ci-owner \
            --env FACTORY_REMOTE_PASSWORD=ci-only-strong-password-2026 \
            --env ALLOW_PLATFORM_PUBLISH=false \
            ffactory-cloud:test
      - name: Verify cloud health and access protection
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs ffactory-cloud
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Forwarded-For: 203.0.113.7' \
            --header 'Host: factory.example' \
            http://127.0.0.1:8787/api/dashboard)" = "401"
      - name: Show container logs after failure
        if: failure()
        run: docker logs ffactory-cloud

